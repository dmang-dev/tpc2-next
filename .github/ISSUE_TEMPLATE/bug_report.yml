name: Bug report
description: Report a reproducible problem with TPC2 Next
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove serial numbers, local
        usernames, filesystem paths, and other personal information from logs
        and screenshots before submitting.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact commands or GUI actions.
      placeholder: |
        1. Start ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Demo device
        - Pico USB bridge
        - Legacy parallel port
        - Not applicable
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Ubuntu / Debian
        - Other Linux
        - macOS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TPC2 Next version
      description: The release tag or the output of `tpc2cli --version`.
      placeholder: v2.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output. Remove personal information first.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information from logs, paths, and screenshots.
          required: true
